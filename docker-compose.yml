name: shopsim

# Host networking: services reach each other, the OTLP endpoint and syslog on 127.0.0.1, and
# the host name shows up as host.name on all telemetry.
# One image for control and the four services: `control` builds it, the others reuse it (never
# pulled). The shoppers (headless Chromium) have their own image.
x-service: &service
  image: shopsim:latest
  pull_policy: never
  network_mode: host
  restart: unless-stopped
  environment: &env
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://127.0.0.1:4318}
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTLP_TRACES_ENDPOINT:-}
    OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    SHOPSIM_SYSLOG_HOST: ${SYSLOG_HOST:-127.0.0.1}
    SHOPSIM_SYSLOG_PORT: ${SYSLOG_PORT:-514}
    SHOPSIM_ENV: ${SHOPSIM_ENV:-lab}
    SHOPSIM_MAX_TOTAL_RPS: ${SHOPSIM_MAX_TOTAL_RPS:-600}
    SHOPSIM_MAX_BURN_CORES: ${SHOPSIM_MAX_BURN_CORES:-2}
    SHOPSIM_MAX_BURN_MB: ${SHOPSIM_MAX_BURN_MB:-300}
  volumes:
    - shopsim-data:/data
    - ${LOG_DIR:-/var/log/shopsim}:/var/log/shopsim
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  mem_limit: 640m
  cpus: 2.5

services:
  control:
    <<: *service
    build: .
    pull_policy: build
    container_name: shopsim-control
    command: ["control"]
    environment:
      <<: *env
      SHOPSIM_CONTROL_PASSWORD: ${SHOPSIM_CONTROL_PASSWORD:-}
    volumes:
      - shopsim-data:/data
      # Lets the panel stop/start the three service containers for real outages.
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 384m
    cpus: 1.5

  catalog:
    <<: *service
    container_name: shopsim-catalog
    command: ["catalog"]

  orders:
    <<: *service
    container_name: shopsim-orders
    command: ["orders"]

  payments:
    <<: *service
    container_name: shopsim-payments
    command: ["payments"]

  # The storefront: web pages with the Motadata RUM SDK + the API behind them (port 8184).
  web:
    <<: *service
    container_name: shopsim-web
    command: ["web"]
    environment:
      <<: *env
      RUM_INTAKE_URL: ${RUM_INTAKE_URL:-}
      RUM_APPLICATION_ID: ${RUM_APPLICATION_ID:-}
      RUM_CLIENT_TOKEN: ${RUM_CLIENT_TOKEN:-}
      RUM_SERVICE: ${RUM_SERVICE:-ShopSim Storefront}
      RUM_VERSION: ${RUM_VERSION:-}

  # Virtual shoppers: headless browsers that use the storefront like real visitors.
  shoppers:
    build:
      context: .
      dockerfile: Dockerfile.shoppers
    image: shopsim-shoppers:latest
    pull_policy: build
    container_name: shopsim-shoppers
    command: ["shoppers"]
    network_mode: host
    restart: unless-stopped
    environment:
      SHOPSIM_CONTROL_URL: http://127.0.0.1:8180
      SHOPSIM_STOREFRONT_URL: ${STOREFRONT_URL:-http://127.0.0.1:8184}
      SHOPSIM_MAX_SHOPPERS: ${SHOPSIM_MAX_SHOPPERS:-3}
    shm_size: 512m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    mem_limit: 1200m
    cpus: 2

volumes:
  shopsim-data:
